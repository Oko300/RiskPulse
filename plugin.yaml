name: riskpulse
version: "0.1.0"
description: "Live SEC EDGAR risk analysis for US public companies. Analyze Form 8-K material events and Form 4 insider activity with clustering detection and plain-language risk narratives."
author: "Oko300"
requires_hermes: ">=0.21.0"

python_dependencies:
  - httpx>=0.27.0
  - beautifulsoup4>=4.12.0
  - lxml>=5.0.0

requires_env:
  - name: SEC_EDGAR_USER_AGENT
    description: "Your name or company + a real contact email (required by SEC EDGAR terms of use). Example: RiskPulse/0.1 (you@example.com)"
    secret: false

provides_tools:
  - analyze_8k_risk
  - analyze_insider_activity

capabilities:
  tools:
    - analyze_8k_risk
    - analyze_insider_activity
